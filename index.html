<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>ShareDesk · Admin login</title>
    <style>
        /* Remove default margins and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* Make the body take up the full screen */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        /* Style the iframe to fill the entire browser window */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    html,body{height:100vh;height:100dvh;height:var(--sd-viewport-height,100dvh)}iframe{display:block}
    </style>
</head>
<body>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbzCe6p0m3u0KmjJpdzxPgaBECVNfS14gffuC9I6c6w574rHYonUWEg1JM6i4Qkt1SlU/exec?page=login" 
        title="ShareDesk admin login"
        allow="autoplay; fullscreen; clipboard-read; clipboard-write"
        allowfullscreen
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation">
    </iframe>

<script>
(function(){
  let scheduled=false;
  function resize(){if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;const v=window.visualViewport;const h=v&&v.scale===1?v.height:innerHeight;document.documentElement.style.setProperty('--sd-viewport-height',Math.max(1,Math.floor(h))+'px');});}
  addEventListener('resize',resize);addEventListener('orientationchange',resize);window.visualViewport?.addEventListener('resize',resize);window.visualViewport?.addEventListener('scroll',resize);resize();
})();
</script>
</body>
</html>
